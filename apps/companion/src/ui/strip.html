<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>herdr companion</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="strip.css">
</head>
<body>
  <header id="chrome">
    <div id="tabsrow">
      <div id="session" title="herdr tab this window follows"></div>
      <div id="tabs" role="tablist"></div>
      <button id="newtab" class="icon" title="New tab (⌘T)">+</button>
    </div>
    <div id="toolbar">
      <button id="back" class="icon" title="Back (⌘[)">‹</button>
      <button id="forward" class="icon" title="Forward (⌘])">›</button>
      <button id="reload" class="icon" title="Reload (⌘R)">↻</button>
      <button id="stop" class="icon" title="Stop">✕</button>
      <form id="urlform"><input id="url" spellcheck="false" autocomplete="off" placeholder="Search or enter address"></form>
      <button id="send" title="Send this page to the session's agent">Send to agent</button>
    </div>
    <form id="sendbar" hidden>
      <input id="note" maxlength="2000" placeholder="Note for the agent (optional); the selected text is sent too">
      <button type="submit">Send</button>
      <button type="button" id="sendcancel">Cancel</button>
    </form>
    <div id="status" hidden></div>
  </header>
  <main id="empty">
    <p id="emptytext">No pages in this session.</p>
    <p class="hint">⌘T opens a page here. Agents in this herdr tab open their pages here too.</p>
  </main>
  <script src="strip.js"></script>
</body>
</html>
